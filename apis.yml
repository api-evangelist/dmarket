aid: dmarket
name: DMarket
description: 'DMarket is a marketplace for trading in-game items and skins across titles like CS2 (CS:GO),
  Dota 2, Team Fortress 2, and Rust. It offers a public JSON-based Trading API that lets developers
  programmatically manage their DMarket inventory: read account balance, sync and deposit items from
  linked game inventories, create and manage sell offers, place standing buy orders (targets), buy and
  withdraw assets, read aggregated market prices, and pull sales history. Requests authenticate with a
  public API key plus a per-request Ed25519 signature. DMarket was surfaced as a portfolio company of
  Pantera Capital. Sector: crypto / gaming.'
